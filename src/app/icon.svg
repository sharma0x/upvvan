<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Upvvan mark: a single leaf on a stem, in the brand's clay accent.

    Why an inline SVG rather than a raster .ico or .png: Next's file-based
    metadata convention picks this up as the site icon with zero extra
    configuration, and `favicon.ico` was being 404'd on every page load — the
    only console error on the storefront.

    The pot is `forest` and the leaf is `clay`, which is the token split from
    DESIGN.md: clay carries the planter story, forest carries the ground.
  -->
  <rect width="32" height="32" rx="7" fill="#fbf7ef"/>
  <path d="M16 26V13" stroke="#223a23" stroke-width="1.6" stroke-linecap="round"/>
  <path
    d="M16 14c0-4.2 2.6-7.4 6.4-7.9.6 3.9-1.6 7.6-6.4 7.9Z"
    fill="#aa5830"/>
  <path
    d="M16 18.5c0-3.4-2.2-6-5.3-6.4-.5 3.2 1.3 6.2 5.3 6.4Z"
    fill="#aa5830" opacity="0.62"/>
</svg>